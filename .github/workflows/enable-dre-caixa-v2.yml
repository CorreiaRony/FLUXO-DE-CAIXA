name: Ativar DRE de Caixa v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/enable-dre-caixa-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DRE
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<button class="soon"><span class="ico">▥</span><span class="nav-label">DRE de Caixa</span></button>','<button data-page="dre"><span class="ico">▥</span><span class="nav-label">DRE de Caixa</span></button>',1)

          if '<section id="dre" class="page">' not in s:
              section='''\n<section id="dre" class="page">\n  <div class="topbar"><div><h1>DRE de Caixa</h1><div class="muted">Caixa realizado por período — Omie × Modelagem</div></div><select id="dreMes" onchange="setActiveMonth(this.value)"></select></div>\n  <div class="grid g4">\n    <div class="card kpi"><div class="label">Entradas Omie</div><div class="value ok" id="dreEntO">R$ 0,00</div></div>\n    <div class="card kpi"><div class="label">Entradas Modelagem</div><div class="value" id="dreEntM">R$ 0,00</div></div>\n    <div class="card kpi"><div class="label">Saídas Omie</div><div class="value bad" id="dreSaiO">R$ 0,00</div></div>\n    <div class="card kpi"><div class="label">Saídas Modelagem</div><div class="value bad" id="dreSaiM">R$ 0,00</div></div>\n  </div>\n  <div style="height:14px"></div>\n  <div class="grid g2">\n    <div class="card"><h2>Resumo do Caixa</h2><table><thead><tr><th>Indicador</th><th class="right">Omie</th><th class="right">Modelagem</th><th class="right">Diferença</th></tr></thead><tbody id="tblDreResumo"></tbody></table></div>\n    <div class="card"><h2>Leitura do período</h2><div id="dreInsight" class="note"></div></div>\n  </div>\n  <div style="height:14px"></div>\n  <div class="card"><h2>Categorias realizadas</h2><div class="muted" style="margin-bottom:10px">Comparação pelas categorias originais das bases; nomenclaturas diferentes não impedem a conciliação por data e valor.</div><div style="overflow:auto;max-height:60vh"><table><thead><tr><th>Categoria</th><th>Tipo</th><th class="right">Omie</th><th class="right">Modelagem</th><th class="right">Diferença</th></tr></thead><tbody id="tblDreCategorias"></tbody></table></div></div>\n</section>\n'''
              s=s.replace('</main>',section+'\n</main>',1)

          if 'function renderDRE()' not in s:
              fn=r'''function renderDRE(){
  if(typeof dreMes==='undefined')return;
  dreMes.innerHTML=state.months.map(x=>`<option value="${x.month}" ${x.month===state.activeMonth?'selected':''}>${monthLabel(x.month)}</option>`).join('');
  const m=getMonth();if(!m){tblDreResumo.innerHTML='<tr><td colspan="4" class="muted">Nenhum período disponível.</td></tr>';tblDreCategorias.innerHTML='';dreInsight.textContent='Importe e confirme Omie e Modelagem para gerar a DRE de Caixa.';return}
  const month=state.activeMonth,om=state.normalized.omie.filter(x=>monthKeyFromDate(x.date)===month),mo=state.normalized.model.filter(x=>monthKeyFromDate(x.date)===month);
  const sum=(rows,type)=>rows.filter(x=>x.type===type).reduce((a,x)=>a+x.value,0),oe=sum(om,'Entrada'),os=sum(om,'Saída'),me=sum(mo,'Entrada'),ms=sum(mo,'Saída'),ro=oe-os,rm=me-ms;
  dreEntO.textContent=BRL(oe);dreEntM.textContent=BRL(me);dreSaiO.textContent=BRL(os);dreSaiM.textContent=BRL(ms);
  tblDreResumo.innerHTML=[['Entradas',oe,me],['Saídas',os,ms],['Resultado líquido',ro,rm]].map(r=>`<tr><td><strong>${r[0]}</strong></td><td class="right">${BRL(r[1])}</td><td class="right">${BRL(r[2])}</td><td class="right ${Math.abs(r[1]-r[2])>.01?'bad':'ok'}">${BRL(r[1]-r[2])}</td></tr>`).join('');
  const diff=ro-rm;dreInsight.innerHTML=`Em ${monthLabel(month)}, o resultado de caixa é <strong>${BRL(ro)}</strong> no Omie e <strong>${BRL(rm)}</strong> na Modelagem. Diferença: <strong class="${Math.abs(diff)>.01?'bad':'ok'}">${BRL(diff)}</strong>. Esta é uma visão por caixa realizado, não por competência.`;
  const bucket=rows=>{const map=new Map();for(const x of rows){const cat=(x.category||x.desc||'SEM CATEGORIA').trim()||'SEM CATEGORIA',k=x.type+'|'+cat;if(!map.has(k))map.set(k,{type:x.type,cat,value:0});map.get(k).value+=x.value}return map},bo=bucket(om),bm=bucket(mo),keys=[...new Set([...bo.keys(),...bm.keys()])];
  keys.sort((a,b)=>Math.abs((bo.get(b)?.value||0)-(bm.get(b)?.value||0))-Math.abs((bo.get(a)?.value||0)-(bm.get(a)?.value||0)));
  tblDreCategorias.innerHTML=keys.length?keys.map(k=>{const o=bo.get(k)?.value||0,mv=bm.get(k)?.value||0,obj=bo.get(k)||bm.get(k);return`<tr><td>${ESC(obj.cat)}</td><td><span class="badge ${obj.type==='Entrada'?'b-ok':'b-bad'}">${obj.type}</span></td><td class="right">${BRL(o)}</td><td class="right">${BRL(mv)}</td><td class="right ${Math.abs(o-mv)>.01?'bad':'ok'}">${BRL(o-mv)}</td></tr>`}).join(''):'<tr><td colspan="5" class="muted">Sem lançamentos confirmados neste período.</td></tr>';
}
'''
              s=s.replace('function bootstrap(){',fn+'\nfunction bootstrap(){',1)

          if 'renderDRE();' not in s:
              s=s.replace('function renderAll(){','function renderAll(){renderDRE();',1)

          p.write_text(s,encoding='utf-8')

      - name: Validate
        run: |
          grep -q 'data-page="dre"' index.html
          grep -q '<section id="dre" class="page">' index.html
          grep -q 'function renderDRE()' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Ativa tela DRE de Caixa funcional'
          git push origin main
